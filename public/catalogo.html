<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent - Catálogo Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: #64748b; font-size: 1.1rem; }
        .filtros-panel {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .filtro-item { display: flex; flex-direction: column; }
        .filtro-item label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .filtro-item select,
        .filtro-item input {
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }
        .filtro-item select:focus,
        .filtro-item input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .filtros-activos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .filtro-tag {
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .filtro-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
        }
        .filtro-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .stats {
            margin-bottom: 20px;
            font-weight: 500;
            color: #475569;
        }
        .grid-autos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .auto-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .auto-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }
        .auto-imagen {
            height: 200px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
            background-color: #e2e8f0; /* fallback */
        }
        .auto-imagen::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
        }
        .auto-categoria {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1e293b;
            z-index: 2;
        }
        .auto-info { padding: 20px; }
        .auto-titulo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .auto-precio {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 16px;
        }
        .auto-precio small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #94a3b8;
        }
        .auto-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .detalle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 0.9rem;
        }
        .detalle-item i { width: 20px; color: #667eea; }
        .btn-seleccionar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-seleccionar:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-regresar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-regresar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        .loading, .no-resultados {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            .btn-regresar { bottom: 20px; right: 20px; padding: 14px 24px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-car" style="margin-right: 10px; background: none; -webkit-text-fill-color: #667eea;"></i>AutoRent</h1>
        <p>Encuentra el auto perfecto para tu viaje</p>
    </div>

    <div class="filtros-panel">
        <h3 style="margin-bottom: 10px; color: #0f172a;"><i class="fas fa-sliders-h" style="margin-right: 10px; color: #667eea;"></i>Filtros</h3>
        <div class="filtros-grid">
            <div class="filtro-item">
                <label>Marca</label>
                <select id="filtro-marca"><option value="">Todas</option></select>
            </div>
            <div class="filtro-item">
                <label>Transmisión</label>
                <select id="filtro-transmision"><option value="">Todas</option></select>
            </div>
            <div class="filtro-item">
                <label>Precio máx./día</label>
                <input type="number" id="filtro-precio" placeholder="$" min="0">
            </div>
            <div class="filtro-item">
                <label>Pasajeros (mín.)</label>
                <input type="number" id="filtro-pasajeros" placeholder="Ej: 5" min="1">
            </div>
            <div class="filtro-item">
                <label>Puertas</label>
                <select id="filtro-puertas">
                    <option value="">Todas</option>
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="filtro-item">
                <label><i class="fas fa-search"></i> Buscar</label>
                <input type="text" id="filtro-buscar" placeholder="Marca o modelo...">
            </div>
        </div>
        <div class="filtros-activos" id="filtros-activos"></div>
        <div class="filtro-acciones">
            <button class="btn btn-secondary" onclick="limpiarFiltros()"><i class="fas fa-times"></i> Limpiar</button>
            <button class="btn btn-primary" onclick="aplicarFiltros()"><i class="fas fa-filter"></i> Aplicar filtros</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="grid-autos" id="lista-autos">
        <div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando catálogo...</div>
    </div>
</div>

<button class="btn-regresar" onclick="regresarAlChat()">
    <i class="fab fa-telegram-plane"></i> Regresar al Chat
</button>

<script>
    const API_URL = '/api/autos';
    const urlParams = new URLSearchParams(window.location.search);
    let filtrosActuales = {};
    let todosLosAutos = []; // Cache local de autos

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
        cargarMetadata();
        cargarFiltrosDesdeURL();
    });

    async function cargarMetadata() {
        try {
            const response = await fetch('/api/metadata');
            const data = await response.json();
            if (data.success) {
                llenarSelect('filtro-marca', data.data.marcas);
                llenarSelect('filtro-transmision', data.data.transmisiones);
            }
        } catch (error) {
            console.error('Error metadata:', error);
        }
    }

    function llenarSelect(id, opciones) {
        const select = document.getElementById(id);
        if (!select) return;
        opciones.forEach(op => {
            const option = document.createElement('option');
            option.value = op;
            option.textContent = op;
            select.appendChild(option);
        });
    }

    async function cargarAutos() {
        try {
            document.getElementById('lista-autos').innerHTML = '<div class="loading"><i class="fas fa-spinner fa-pulse"></i> Cargando...</div>';
            
            const params = new URLSearchParams();
            Object.keys(filtrosActuales).forEach(key => {
                if (filtrosActuales[key]) params.append(key, filtrosActuales[key]);
            });
            
            const response = await fetch(`${API_URL}?${params.toString()}`);
            const data = await response.json();
            
            if (data.success) {
                todosLosAutos = data.data;
                mostrarAutos(todosLosAutos);
                actualizarStats(data.total);
                actualizarFiltrosActivos();
            } else {
                throw new Error(data.error || 'Error desconocido');
            }
        } catch (error) {
            console.error('Error cargando autos:', error);
            document.getElementById('lista-autos').innerHTML = '<div class="no-resultados">❌ Error al cargar el catálogo</div>';
        }
    }

    function mostrarAutos(autos) {
        const container = document.getElementById('lista-autos');
        if (autos.length === 0) {
            container.innerHTML = '<div class="no-resultados"><i class="fas fa-car-side"></i> No se encontraron vehículos</div>';
            return;
        }
        
        container.innerHTML = autos.map(auto => {
            // Usar la imagen del Excel; si está vacía, usar fallback
            const imagenUrl = auto.imagen && auto.imagen.trim() !== '' 
                ? auto.imagen 
                : 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=400';
                
            return `
                <div class="auto-card">
                    <div class="auto-imagen" style="background-image: url('${imagenUrl}')">
                        <span class="auto-categoria">${auto.tipo || 'Auto'}</span>
                    </div>
                    <div class="auto-info">
                        <div class="auto-titulo">${auto.marca} ${auto.modelo}</div>
                        <div class="auto-precio">$${auto.precio.toLocaleString()} <small>/ día</small></div>
                        <div class="auto-detalles">
                            <div class="detalle-item"><i class="fas fa-door-open"></i> ${auto.puertas} puertas</div>
                            <div class="detalle-item"><i class="fas fa-cog"></i> ${auto.transmision}</div>
                            <div class="detalle-item"><i class="fas fa-users"></i> ${auto.pasajeros} asientos</div>
                            <div class="detalle-item"><i class="fas fa-calendar"></i> ${auto.año}</div>
                        </div>
                        <button class="btn-seleccionar" onclick="seleccionarAuto('${auto.vehiculo.replace(/'/g, "\\'")}')">
                            <i class="fas fa-check-circle"></i> Seleccionar
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function actualizarStats(total) {
        document.getElementById('stats').innerHTML = `<i class="fas fa-list"></i> ${total} vehículos encontrados`;
    }

    function seleccionarAuto(vehiculo) {
        navigator.clipboard.writeText(vehiculo).then(() => {
            alert(`✅ "${vehiculo}" copiado al portapapeles.\n\nRegresa al chat y pega el nombre para continuar.`);
        }).catch(() => {
            prompt('Copia el nombre del vehículo:', vehiculo);
        });
        setTimeout(() => {
            window.location.href = 'https://t.me/Autorentai_bot';
        }, 500);
    }

    function aplicarFiltros() {
        filtrosActuales = {
            marca: document.getElementById('filtro-marca').value,
            transmision: document.getElementById('filtro-transmision').value,
            precio_max: document.getElementById('filtro-precio').value,
            pasajeros: document.getElementById('filtro-pasajeros').value,
            puertas: document.getElementById('filtro-puertas').value,
            search: document.getElementById('filtro-buscar').value
        };
        Object.keys(filtrosActuales).forEach(k => { if (!filtrosActuales[k]) delete filtrosActuales[k]; });
        cargarAutos();
    }

    function limpiarFiltros() {
        document.querySelectorAll('.filtro-item select, .filtro-item input').forEach(el => el.value = '');
        filtrosActuales = {};
        cargarAutos();
    }

    function cargarFiltrosDesdeURL() {
        const campos = ['marca', 'transmision', 'precio_max', 'pasajeros', 'puertas'];
        campos.forEach(campo => {
            const valor = urlParams.get(campo);
            if (valor) {
                filtrosActuales[campo] = valor;
                const el = document.getElementById(`filtro-${campo}`);
                if (el) el.value = valor;
            }
        });
        cargarAutos();
    }

    function actualizarFiltrosActivos() {
        const container = document.getElementById('filtros-activos');
        const filtros = Object.entries(filtrosActuales).filter(([_, v]) => v);
        if (filtros.length === 0) {
            container.innerHTML = '';
            return;
        }
        container.innerHTML = filtros.map(([k, v]) => `
            <span class="filtro-tag">${k}: ${v} <button onclick="eliminarFiltro('${k}')">&times;</button></span>
        `).join('');
    }

    function eliminarFiltro(key) {
        delete filtrosActuales[key];
        document.getElementById(`filtro-${key}`).value = '';
        cargarAutos();
    }

    function regresarAlChat() {
        window.location.href = 'https://t.me/Autorentai_bot';
    }

    // Búsqueda con debounce
    let timeout;
    document.getElementById('filtro-buscar')?.addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(aplicarFiltros, 500);
    });
</script>
</body>
</html>
