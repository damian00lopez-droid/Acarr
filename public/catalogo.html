<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent - Catálogo de Vehículos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
            background-color: #f9f9f9;
        }
        h1 { color: #1a1a1a; margin-bottom: 20px; }
        .filtros { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .badge-filtro {
            background: #0077ff;
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            display: inline-block;
            margin: 5px 5px 0 0;
            font-size: 14px;
        }
        .grid-autos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }
        .auto-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            border: 1px solid #eee;
        }
        .auto-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .auto-card h3 { color: #0a2540; margin-bottom: 10px; font-size: 1.4rem; }
        .auto-card p { margin: 8px 0; color: #444; }
        .auto-card .precio { font-weight: bold; color: #2e7d32; font-size: 1.2rem; margin: 15px 0; }
        .btn-reservar {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-reservar:hover { background: #1da851; }
        .btn-regresar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0a2540;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .btn-regresar:hover { background: #1a3a5c; }
        .sin-resultados {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: #666;
        }
        .loader { text-align: center; padding: 40px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>🚗 Catálogo de Vehículos AutoRent</h1>
    
    <div class="filtros">
        <h3 style="margin-bottom: 10px;">🔍 Filtros aplicados:</h3>
        <div id="filtros-activos"></div>
    </div>
    
    <div id="lista-autos" class="grid-autos">
        <div class="loader">Cargando vehículos disponibles...</div>
    </div>
    
    <button class="btn-regresar" onclick="regresarAlChat()">
        💬 Regresar al Chat
    </button>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const filtros = {
            tipo: urlParams.get('tipo'),
            marca: urlParams.get('marca'),
            transmision: urlParams.get('transmision'),
            precio_max: urlParams.get('precio_max'),
            pasajeros: urlParams.get('pasajeros')
        };
        
        // Mostrar filtros activos
        const contenedorFiltros = document.getElementById('filtros-activos');
        let htmlFiltros = '';
        for (const [clave, valor] of Object.entries(filtros)) {
            if (valor) {
                const etiqueta = {
                    tipo: 'Categoría',
                    marca: 'Marca',
                    transmision: 'Transmisión',
                    precio_max: 'Precio máximo',
                    pasajeros: 'Mínimo pasajeros'
                }[clave] || clave;
                htmlFiltros += `<span class="badge-filtro">${etiqueta}: ${valor}</span>`;
            }
        }
        contenedorFiltros.innerHTML = htmlFiltros || '<p style="color:#888;">✨ Mostrando todos los vehículos disponibles</p>';
        
        // Construir URL para la API con los mismos filtros
        function construirUrlAPI() {
            const base = '/api/autos';
            const params = new URLSearchParams();
            if (filtros.tipo) params.append('tipo', filtros.tipo);
            if (filtros.marca) params.append('marca', filtros.marca);
            if (filtros.transmision) params.append('transmision', filtros.transmision);
            if (filtros.precio_max) params.append('precio_max', filtros.precio_max);
            if (filtros.pasajeros) params.append('pasajeros', filtros.pasajeros);
            const query = params.toString();
            return query ? `${base}?${query}` : base;
        }
        
        // Cargar autos desde el backend
        async function cargarAutos() {
            const contenedor = document.getElementById('lista-autos');
            try {
                const response = await fetch(construirUrlAPI());
                if (!response.ok) throw new Error('Error de red');
                const autos = await response.json();
                
                if (autos.length === 0) {
                    contenedor.innerHTML = '<div class="sin-resultados">😕 No se encontraron vehículos con esos filtros.<br>Intenta con otras preferencias.</div>';
                    return;
                }
                
                contenedor.innerHTML = autos.map(auto => `
                    <div class="auto-card">
                        <h3>${auto.marca} ${auto.modelo}</h3>
                        <p><strong>Categoría:</strong> ${auto.tipo}</p>
                        <p><strong>Transmisión:</strong> ${auto.transmision}</p>
                        <p><strong>Pasajeros:</strong> ${auto.pasajeros}</p>
                        <p><strong>Puertas:</strong> ${auto.puertas}</p>
                        ${auto.año ? `<p><strong>Año:</strong> ${auto.año}</p>` : ''}
                        <div class="precio">💰 $${auto.precio} MXN / día</div>
                        <button class="btn-reservar" onclick="seleccionarAuto('${auto.vehiculo}')">
                            Rentar este vehículo
                        </button>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('Error cargando catálogo:', error);
                contenedor.innerHTML = '<div class="sin-resultados">❌ Error al cargar el catálogo. Intenta recargar la página.</div>';
            }
        }
        
        // Función para regresar al chat (WhatsApp)
        function seleccionarAuto(modeloCompleto) {
            // Construir mensaje predefinido para enviar a WhatsApp
            const mensaje = encodeURIComponent(`Me interesa el ${modeloCompleto}. Quiero continuar con la reserva.`);
            // Número de WhatsApp de la empresa (debe configurarse en variable de entorno o fijo)
            const numeroWhatsApp = '521234567890'; // Reemplazar con número real
            window.open(`https://wa.me/${numeroWhatsApp}?text=${mensaje}`, '_blank');
        }
        
        function regresarAlChat() {
            const ref = urlParams.get('ref');
            if (ref === 'chatbot' && window.history.length > 1) {
                window.history.back();
            } else {
                // Fallback: abrir WhatsApp con mensaje genérico
                window.open('https://wa.me/521234567890?text=Hola%20AutoRent,%20quiero%20continuar%20con%20mi%20consulta.', '_blank');
            }
        }
        
        // Iniciar carga
        cargarAutos();
    </script>
</body>
</html>
