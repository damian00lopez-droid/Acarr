<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent - 30 Modelos Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .header p { color: #64748b; font-size: 1.1rem; }
        .filtros-panel {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .filtros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }
        .filtro-item { display: flex; flex-direction: column; }
        .filtro-item label {
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .filtro-item select,
        .filtro-item input {
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }
        .filtro-item select:focus,
        .filtro-item input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .filtros-activos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .filtro-tag {
            background: #667eea;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .filtro-tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 4px;
        }
        .filtro-acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.2);
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .stats {
            margin-bottom: 20px;
            font-weight: 500;
            color: #475569;
        }
        .grid-autos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .auto-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .auto-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }
        .auto-imagen {
            height: 200px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
        }
        .auto-imagen::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
            pointer-events: none;
        }
        .auto-categoria {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1e293b;
            z-index: 2;
        }
        .auto-info { padding: 20px; }
        .auto-titulo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .auto-precio {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 16px;
        }
        .auto-precio small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #94a3b8;
        }
        .auto-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .detalle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-size: 0.9rem;
        }
        .detalle-item i { width: 20px; color: #667eea; }
        .btn-seleccionar {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-seleccionar:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .btn-regresar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #25D366;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
            transition: all 0.3s;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-regresar:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        .loading, .no-resultados {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            .btn-regresar { bottom: 20px; right: 20px; padding: 14px 24px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-car" style="margin-right: 10px; background: none; -webkit-text-fill-color: #667eea;"></i>AutoRent</h1>
        <p>30 modelos disponibles · Encuentra tu auto ideal</p>
    </div>

    <div class="filtros-panel">
        <h3 style="margin-bottom: 10px; color: #0f172a;"><i class="fas fa-sliders-h" style="margin-right: 10px; color: #667eea;"></i>Filtros</h3>
        <div class="filtros-grid">
            <div class="filtro-item">
                <label>Marca</label>
                <select id="filtro-marca"><option value="">Todas</option></select>
            </div>
            <div class="filtro-item">
                <label>Transmisión</label>
                <select id="filtro-transmision"><option value="">Todas</option></select>
            </div>
            <div class="filtro-item">
                <label>Precio máx./día</label>
                <input type="number" id="filtro-precio" placeholder="$" min="0">
            </div>
            <div class="filtro-item">
                <label>Pasajeros (mín.)</label>
                <input type="number" id="filtro-pasajeros" placeholder="Ej: 5" min="1">
            </div>
            <div class="filtro-item">
                <label>Puertas</label>
                <select id="filtro-puertas">
                    <option value="">Todas</option>
                    <option value="2">2</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            <div class="filtro-item">
                <label><i class="fas fa-search"></i> Buscar</label>
                <input type="text" id="filtro-buscar" placeholder="Marca o modelo...">
            </div>
        </div>
        <div class="filtros-activos" id="filtros-activos"></div>
        <div class="filtro-acciones">
            <button class="btn btn-secondary" onclick="limpiarFiltros()"><i class="fas fa-times"></i> Limpiar</button>
            <button class="btn btn-primary" onclick="aplicarFiltros()"><i class="fas fa-filter"></i> Aplicar filtros</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="grid-autos" id="lista-autos"></div>
</div>

<button class="btn-regresar" onclick="regresarAlChat()">
    <i class="fab fa-telegram-plane"></i> Regresar al Chat
</button>

<script>
    // Datos de los 30 autos con imágenes reales (Unsplash)
    const autosData = [
        { marca:"Toyota", modelo:"Corolla", año:2022, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:35, imagen:"https://images.unsplash.com/photo-1623860841280-29e069e73d47?w=400" },

        { marca:"Kia", modelo:"Rio", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:35, imagen:"https://images.unsplash.com/photo-1590362891991-f776e747a588?w=400" },
        { marca:"Hyundai", modelo:"i10", año:2020, tipo:"Compacto", transmision:"Manual", puertas:5, pasajeros:4, precio:35, imagen:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=400" },
        { marca:"Chevrolet", modelo:"Aveo", año:2022, tipo:"Sedán", transmision:"Manual", puertas:4, pasajeros:5, precio:35, imagen:"https://images.unsplash.com/photo-1593361427244-934c2649a515?w=400" },
        { marca:"Renault", modelo:"Logan", año:2021, tipo:"Sedán", transmision:"Manual", puertas:4, pasajeros:5, precio:35, imagen:"https://images.unsplash.com/photo-1567808291548-fc3ee04dbcf0?w=400" },
        { marca:"Suzuki", modelo:"Swift", año:2023, tipo:"Hatchback", transmision:"Automática", puertas:5, pasajeros:4, precio:35, imagen:"https://images.unsplash.com/photo-1571607388263-3254c8a51169?w=400" },
        { marca:"VW", modelo:"Jetta", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1617531653332-bd59c2026859?w=400" },
        { marca:"Honda", modelo:"Civic", año:2022, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1603584173870-7d23f9715152?w=400" },
        { marca:"Mazda", modelo:"Mazda 3", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1568605117036-5fe5b0e9e8f1?w=400" },
        { marca:"Ford", modelo:"Fusion", año:2020, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=400" },
        { marca:"Toyota", modelo:"Camry", año:2022, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1621007947382-bb3c3994e3fb?w=400" },
        { marca:"Nissan", modelo:"Altima", año:2021, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=400" },
        { marca:"Hyundai", modelo:"Elantra", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:60, imagen:"https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=400" },
        { marca:"BMW", modelo:"3 Series", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1555215695-3004980ad54e?w=400" },
        { marca:"Mercedes", modelo:"C-Class", año:2022, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1617531653332-bd59c2026859?w=400" },
        { marca:"Audi", modelo:"A4", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1603584173870-7d23f9715152?w=400" },
        { marca:"Tesla", modelo:"Model 3", año:2023, tipo:"Eléctrico", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1560958089-b8a1929cea89?w=400" },
        { marca:"Lexus", modelo:"IS", año:2022, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1622180203379-51d1e2f5c7e4?w=400" },
        { marca:"Volvo", modelo:"S60", año:2023, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?w=400" },
        { marca:"Jaguar", modelo:"XE", año:2021, tipo:"Sedán", transmision:"Automática", puertas:4, pasajeros:5, precio:120, imagen:"https://images.unsplash.com/photo-1580274455191-2c1c2c8e8f1f?w=400" },
        { marca:"Toyota", modelo:"Sienna", año:2022, tipo:"Van", transmision:"Automática", puertas:5, pasajeros:8, precio:85, imagen:"https://images.unsplash.com/photo-1609521263047-f8f205293f24?w=400" },
        { marca:"Honda", modelo:"Odyssey", año:2021, tipo:"Van", transmision:"Automática", puertas:5, pasajeros:8, precio:85, imagen:"https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=400" },
        { marca:"Kia", modelo:"Carnival", año:2023, tipo:"Van", transmision:"Automática", puertas:5, pasajeros:7, precio:85, imagen:"https://images.unsplash.com/photo-1580274455191-2c1c2c8e8f1f?w=400" },
        { marca:"Chevrolet", modelo:"Suburban", año:2022, tipo:"SUV", transmision:"Automática", puertas:5, pasajeros:9, precio:150, imagen:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?w=400" },
        { marca:"Ford", modelo:"Expedition", año:2021, tipo:"SUV", transmision:"Automática", puertas:5, pasajeros:8, precio:150, imagen:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?w=400" },
        { marca:"Cadillac", modelo:"Escalade", año:2023, tipo:"SUV", transmision:"Automática", puertas:5, pasajeros:7, precio:150, imagen:"https://images.unsplash.com/photo-1580274455191-2c1c2c8e8f1f?w=400" },
        { marca:"Dacia", modelo:"Duster", año:2022, tipo:"SUV", transmision:"Manual", puertas:5, pasajeros:5, precio:50, imagen:"https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=400" },
        { marca:"Suzuki", modelo:"Ertiga", año:2023, tipo:"Van", transmision:"Automática", puertas:5, pasajeros:7, precio:50, imagen:"https://images.unsplash.com/photo-1580274455191-2c1c2c8e8f1f?w=400" },
        { marca:"Toyota", modelo:"Avanza", año:2022, tipo:"Van", transmision:"Automática", puertas:5, pasajeros:7, precio:50, imagen:"https://images.unsplash.com/photo-1580274455191-2c1c2c8e8f1f?w=400" }
    ];

    // Agregar vehículo completo para facilitar búsqueda
    autosData.forEach((a,i) => {
        a.vehiculo = `${a.marca} ${a.modelo}`;
        a.id = i;
    });

    let filtrosActuales = {};
    const urlParams = new URLSearchParams(window.location.search);

    // Llenar selects con marcas/transmisiones únicas
    function cargarMetadata() {
        const marcas = [...new Set(autosData.map(a => a.marca))].sort();
        const transmisiones = [...new Set(autosData.map(a => a.transmision))].sort();
        llenarSelect('filtro-marca', marcas);
        llenarSelect('filtro-transmision', transmisiones);
    }

    function llenarSelect(id, opciones) {
        const select = document.getElementById(id);
        opciones.forEach(op => {
            const option = document.createElement('option');
            option.value = op;
            option.textContent = op;
            select.appendChild(option);
        });
    }

    function filtrarAutos() {
        let resultados = autosData.filter(auto => {
            if (filtrosActuales.marca && auto.marca !== filtrosActuales.marca) return false;
            if (filtrosActuales.transmision && auto.transmision !== filtrosActuales.transmision) return false;
            if (filtrosActuales.precio_max && auto.precio > parseFloat(filtrosActuales.precio_max)) return false;
            if (filtrosActuales.pasajeros && auto.pasajeros < parseInt(filtrosActuales.pasajeros)) return false;
            if (filtrosActuales.puertas && auto.puertas != parseInt(filtrosActuales.puertas)) return false;
            if (filtrosActuales.search) {
                const term = filtrosActuales.search.toLowerCase();
                return auto.vehiculo.toLowerCase().includes(term) || auto.marca.toLowerCase().includes(term) || auto.modelo.toLowerCase().includes(term);
            }
            return true;
        });
        return resultados;
    }

    function mostrarAutos() {
        const resultados = filtrarAutos();
        const container = document.getElementById('lista-autos');
        const stats = document.getElementById('stats');
        stats.innerHTML = `<i class="fas fa-list"></i> ${resultados.length} vehículos encontrados`;

        if (resultados.length === 0) {
            container.innerHTML = '<div class="no-resultados"><i class="fas fa-car-side"></i> No se encontraron vehículos</div>';
            return;
        }

        container.innerHTML = resultados.map(auto => `
            <div class="auto-card">
                <div class="auto-imagen" style="background-image: url('${auto.imagen}')">
                    <span class="auto-categoria">${auto.tipo}</span>
                </div>
                <div class="auto-info">
                    <div class="auto-titulo">${auto.marca} ${auto.modelo}</div>
                    <div class="auto-precio">$${auto.precio.toLocaleString()} <small>/ día</small></div>
                    <div class="auto-detalles">
                        <div class="detalle-item"><i class="fas fa-door-open"></i> ${auto.puertas} puertas</div>
                        <div class="detalle-item"><i class="fas fa-cog"></i> ${auto.transmision}</div>
                        <div class="detalle-item"><i class="fas fa-users"></i> ${auto.pasajeros} asientos</div>
                        <div class="detalle-item"><i class="fas fa-calendar"></i> ${auto.año}</div>
                    </div>
                    <button class="btn-seleccionar" onclick="seleccionarAuto('${auto.vehiculo}')">
                        <i class="fas fa-check-circle"></i> Seleccionar
                    </button>
                </div>
            </div>
        `).join('');
        actualizarFiltrosActivos();
    }

    function actualizarStats() {}
    function actualizarFiltrosActivos() {
        const container = document.getElementById('filtros-activos');
        const filtros = Object.entries(filtrosActuales).filter(([k,v]) => v);
        if (filtros.length === 0) {
            container.innerHTML = '';
            return;
        }
        container.innerHTML = filtros.map(([k,v]) => `
            <span class="filtro-tag">${k}: ${v} <button onclick="eliminarFiltro('${k}')">&times;</button></span>
        `).join('');
    }

    function eliminarFiltro(key) {
        delete filtrosActuales[key];
        document.getElementById(`filtro-${key}`).value = '';
        mostrarAutos();
    }

    function aplicarFiltros() {
        filtrosActuales = {
            marca: document.getElementById('filtro-marca').value,
            transmision: document.getElementById('filtro-transmision').value,
            precio_max: document.getElementById('filtro-precio').value,
            pasajeros: document.getElementById('filtro-pasajeros').value,
            puertas: document.getElementById('filtro-puertas').value,
            search: document.getElementById('filtro-buscar').value
        };
        Object.keys(filtrosActuales).forEach(k => { if (!filtrosActuales[k]) delete filtrosActuales[k]; });
        mostrarAutos();
    }

    function limpiarFiltros() {
        document.querySelectorAll('.filtro-item select, .filtro-item input').forEach(el => el.value = '');
        filtrosActuales = {};
        mostrarAutos();
    }

    function cargarFiltrosDesdeURL() {
        const campos = ['marca', 'transmision', 'precio_max', 'pasajeros', 'puertas'];
        campos.forEach(campo => {
            const valor = urlParams.get(campo);
            if (valor) {
                filtrosActuales[campo] = valor;
                const el = document.getElementById(`filtro-${campo}`);
                if (el) el.value = valor;
            }
        });
        mostrarAutos();
    }

    function seleccionarAuto(vehiculo) {
        navigator.clipboard.writeText(vehiculo).then(() => {
            alert(`✅ "${vehiculo}" copiado al portapapeles.\n\nRegresa al chat y pega el nombre para continuar.`);
        }).catch(() => {
            prompt('Copia el nombre del vehículo:', vehiculo);
        });
        setTimeout(() => {
            window.location.href = 'https://t.me/Autorentai_bot';
        }, 500);
    }
