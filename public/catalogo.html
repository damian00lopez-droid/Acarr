<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent AI - Catálogo Personalizado</title>
    <style>
        :root { --primary: #25D366; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background-color: var(--bg); }
        header { background: #2c3e50; color: white; padding: 1.5rem; text-align: center; }
        .filter-header { background: white; padding: 1rem; border-bottom: 2px solid var(--primary); text-align: center; font-weight: bold; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-content { padding: 15px; flex-grow: 1; }
        .badge { background: var(--accent); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 5px; }
        .price { font-size: 1.4rem; color: var(--primary); font-weight: bold; margin: 10px 0; }
        .btn-select { display: block; background: var(--primary); color: white; text-align: center; padding: 10px; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .no-results { text-align: center; padding: 50px; font-size: 1.2rem; color: #7f8c8d; }
    </style>
</head>
<body>

<header>
    <h1>Tu Selección Exclusiva</h1>
</header>

<div class="filter-header" id="info-filtros">
    Aplicando preferencias...
</div>

<div class="container" id="grid-autos">
    </div>

<script>
    // Configura tu URL de SheetDB aquí
    const API_URL = "TU_URL_DE_SHEETDB";
    const MI_WHATSAPP = "525555555555";

    async function inicializarPagina() {
        try {
            // 1. Capturar preferencias de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const pref = {
                transmision: urlParams.get('transmision'), // 'Manual' o 'Automatica'
                puertas: urlParams.get('puertas'),
                asientos: urlParams.get('asientos'),
                categoria: urlParams.get('categoria')
            };

            // Mostrar al usuario qué filtros se aplicaron
            document.getElementById('info-filtros').innerText = 
                `Filtros: ${pref.transmision || 'Cualquier'} | ${pref.puertas || 'X'} Puertas | ${pref.asientos || 'X'} Asientos`;

            // 2. Consultar SheetDB
            const response = await fetch(API_URL);
            const autos = await response.json();

            // 3. Filtrado Lógico Estricto
            const filtrados = autos.filter(a => {
                const matchTrans = pref.transmision ? a.Transmision === pref.transmision : true;
                const matchPuertas = pref.puertas ? parseInt(a.Puertas) === parseInt(pref.puertas) : true;
                const matchAsientos = pref.asientos ? parseInt(a.Asientos) === parseInt(pref.asientos) : true;
                const disponible = a.Disponibilidad === 'Disponible';
                return matchTrans && matchPuertas && matchAsientos && disponible;
            });

            // 4. Renderizar
            const grid = document.getElementById('grid-autos');
            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="no-results">No tenemos autos con esas características exactas por ahora. <br><br> <a href="https://wa.me/${MI_WHATSAPP}">Volver al chat</a></div>`;
                return;
            }

            filtrados.forEach(a => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${a.Imagen}" alt="${a.Modelo}">
                        <div class="card-content">
                            <span class="badge">${a.Transmision}</span>
                            <span class="badge">${a.Categoria}</span>
                            <h3>${a.Marca} ${a.Modelo}</h3>
                            <p style="color: #7f8c8d; font-size: 0.9rem;">${a.Puertas} Puertas | ${a.Asientos} Asientos</p>
                            <div class="price">$${a.Precio_Por_Dia} MXN / día</div>
                            <a href="https://wa.me/${MI_WHATSAPP}?text=Hola! Me interesa el ${a.Marca} ${a.Modelo} (${a.Transmision}) que vi en la web." class="btn-select">Rentar ahora</a>
                        </div>
                    </div>
                `;
            });

        } catch (error) {
            console.error("Error cargando autos:", error);
        }
    }

    inicializarPagina();
</script>
</body>
</html>
