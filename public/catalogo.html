<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoRent - Catálogo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; padding: 20px; }
        .filtros { margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; }
        .grid-autos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .auto-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; }
        .btn-regresar { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            background: #25D366; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 50px; 
            font-size: 16px; 
            cursor: pointer; 
        }
        .volver-link { margin-top: 30px; text-align: center; }
    </style>
</head>
<body>
    <h1>🚗 Catálogo de Vehículos</h1>
    
    <div class="filtros">
        <h3>Filtros aplicados:</h3>
        <div id="filtros-activos"></div>
    </div>
    
    <div class="grid-autos" id="lista-autos">
        Cargando vehículos...
    </div>
    
    <div class="volver-link">
        <button class="btn-regresar" onclick="regresarAlChat()">
            💬 Regresar al Chat
        </button>
    </div>

    <script>
        // Obtener parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const filtros = {
            tipo: urlParams.get('tipo'),
            marca: urlParams.get('marca'),
            transmision: urlParams.get('transmision'),
            precio_max: urlParams.get('precio_max'),
            pasajeros: urlParams.get('pasajeros')
        };
        
        // Mostrar filtros activos
        const filtrosActivos = document.getElementById('filtros-activos');
        let filtrosTexto = '';
        for (const [key, value] of Object.entries(filtros)) {
            if (value) {
                filtrosTexto += `<span style="background: #007bff; color: white; padding: 5px 10px; margin: 5px; display: inline-block; border-radius: 20px;">${key}: ${value}</span>`;
            }
        }
        filtrosActivos.innerHTML = filtrosTexto || '<p>Sin filtros activos</p>';
        
        // Cargar autos (aquí deberías hacer fetch a tu API de SheetDB)
        async function cargarAutos() {
            try {
                // Puedes exponer un endpoint en tu servidor que devuelva los autos
                const response = await fetch('https://sheetdb.io/api/v1/qxqp7rc3svryx');
                let autos = await response.json();
                
                // Aplicar filtros
                if (filtros.tipo) {
                    autos = autos.filter(a => a.Tipo === filtros.tipo);
                }
                if (filtros.marca) {
                    autos = autos.filter(a => a.Marca === filtros.marca);
                }
                if (filtros.transmision) {
                    autos = autos.filter(a => a.Transmision === filtros.transmision);
                }
                if (filtros.precio_max) {
                    autos = autos.filter(a => parseFloat(a.Precio_Por_Dia) <= parseFloat(filtros.precio_max));
                }
                if (filtros.pasajeros) {
                    autos = autos.filter(a => a.Pasajeros >= filtros.pasajeros);
                }
                
                // Mostrar autos
                const contenedor = document.getElementById('lista-autos');
                if (autos.length === 0) {
                    contenedor.innerHTML = '<p>No hay vehículos con esos filtros.</p>';
                    return;
                }
                
                contenedor.innerHTML = autos.map(auto => `
                    <div class="auto-card">
                        <h3>${auto.Marca} ${auto.Modelo}</h3>
                        <p><strong>Tipo:</strong> ${auto.Tipo}</p>
                        <p><strong>Transmisión:</strong> ${auto.Transmision}</p>
                        <p><strong>Año:</strong> ${auto.Año}</p>
                        <p><strong>Pasajeros:</strong> ${auto.Pasajeros}</p>
                        <p><strong>Precio por día:</strong> $${auto.Precio_Por_Dia} MXN</p>
                        <p style="margin-top: 10px;"><strong>Para reservar este vehículo, regresa al chat y menciona:</strong><br>
                        "Quiero el ${auto.Marca} ${auto.Modelo}"</p>
                    </div>
                `).join('');
                
            } catch (error) {
                document.getElementById('lista-autos').innerHTML = 
                    '<p>Error al cargar el catálogo. Por favor, intenta más tarde.</p>';
            }
        }
        
        function regresarAlChat() {
            // Detectar si viene de Telegram, WhatsApp o Web
            const ref = urlParams.get('ref');
            
            if (ref === 'chatbot') {
                // Intentar volver a la app anterior
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    // Links directos según plataforma
                    alert('Regresa a tu aplicación de chat para continuar con la reserva.');
                }
            }
        }
        
        cargarAutos();
    </script>
</body>
</html>
